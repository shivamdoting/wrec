name: Probe bench on Blacksmith

on:
  push:
    branches:
      - probe/blacksmith-bench

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.run }}
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Machine
        continue-on-error: true
        run: |
          set -x
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.model hw.ncpu hw.memsize
          sysctl kern.hv_vmm_present || true
          csrutil status || true
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          pmset -g batt; pmset -g therm
          uptime
          top -l 6 -n 0 -s 1 | grep "CPU usage"
          whoami; ps -o pid,ppid,comm -p $$ -p $PPID
          ps -axo pid,ppid,%cpu,rss,comm | sort -k3 -nr | head -15

      - name: TCC state
        continue-on-error: true
        run: |
          set -x
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service,client,client_type,auth_value from access where service like '%Screen%' or service like '%PostEvent%' or service like '%Accessib%';" || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service,client,client_type,auth_value from access where service like '%Screen%';" || true
          sudo touch "/Library/Application Support/com.apple.TCC/probe-write" && echo SYSTEM_TCC_WRITABLE || echo SYSTEM_TCC_NOT_WRITABLE
          sudo rm -f "/Library/Application Support/com.apple.TCC/probe-write"

      - name: VideoToolbox and display
        continue-on-error: true
        run: |
          swiftc -O .github/probe/vt.swift -o /tmp/vt
          /tmp/vt

      - name: Build wrec
        run: cargo build --release -p cli -p daemon

      - name: Targets before grant
        continue-on-error: true
        run: |
          export WREC_HOME=/tmp/wh WREC_DATA_DIR=/tmp/wd WREC_HEADLESS=1
          target/release/wrec targets --json 2>&1 | tee /tmp/targets-before.log | head -c 2000
          target/release/wrec daemon stop --json || true

      - name: Grant Screen Recording via TCC
        run: |
          set -x
          mkdir -p /tmp/wrec-ref
          engine=$(find "$PWD/target/release/build" -name capture-engine -type f | head -1)
          echo "engine=$engine"
          cp target/release/wrec target/release/daemon /tmp/wrec-ref/
          cp "$engine" /tmp/wrec-ref/capture-engine
          now=$(date +%s)
          for c in "$PWD/target/release/daemon" "$PWD/target/release/wrec" "$engine" /tmp/wrec-ref/wrec /tmp/wrec-ref/daemon /tmp/wrec-ref/capture-engine "$(command -v bun)" "$HOME/bin/Runner.Listener" "$HOME/bin/Runner.Worker"; do
            for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
              sudo sqlite3 "$db" "insert or replace into access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) values ('kTCCServiceScreenCapture','$c',1,2,4,1,'UNUSED',0,$now);"
            done
          done
          sudo killall tccd || true
          sleep 2
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select client,auth_value from access where service='kTCCServiceScreenCapture';"

      - name: Targets after grant
        continue-on-error: true
        run: |
          export WREC_HOME=/tmp/wh2 WREC_DATA_DIR=/tmp/wd2 WREC_HEADLESS=1
          target/release/wrec targets --json 2>&1 | tee /tmp/targets-after.log | head -c 3000
          tail -40 /tmp/wh2/daemon.log || true
          target/release/wrec daemon stop --json || true

      - name: Smoke bench
        id: smoke
        continue-on-error: true
        timeout-minutes: 10
        run: |
          bun run bench --wrec target/release/wrec 2>&1 | tee /tmp/smoke.log
          grep -q "status: pass" /tmp/smoke.log

      - name: CPU idle trace (60 s)
        continue-on-error: true
        run: top -l 60 -n 0 -s 1 | grep "CPU usage" | tee /tmp/idle.log

      - name: A/A release bench (same binary twice)
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          bun run bench release --wrec target/release/wrec --against /tmp/wrec-ref/wrec 2>&1 | tee /tmp/release.log
          grep -q "status: pass" /tmp/release.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.run }}
          path: |
            /tmp/*.log
            benchmarks/runs/
            benchmarks/results/
          if-no-files-found: ignore
