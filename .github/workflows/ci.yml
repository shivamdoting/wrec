name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CLI and capture lifecycle
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg dbus-daemon
      - name: Build and test
        run: |
          cargo fmt --check
          cargo check --workspace --locked
          cargo test --workspace --locked
          dbus-run-session -- cargo test -p linux portal_roundtrip --locked -- --ignored
          ./scripts/package-cli-linux.sh
      - name: Test packaged CLI
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf dist/cli/linux/wrec-cli-x86_64-unknown-linux-gnu.tar.gz -C "$stage"
          python3 scripts/test-cli-linux.py "$stage"
      - name: Upload Linux CLI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrec-cli-linux
          path: dist/cli/linux/*.tar.gz

  rust:
    name: Rust checks
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          swiftc --version
          xcodebuild -version

      - name: Prepare Xcode Metal toolchain
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Check
        run: |
          cargo fmt --check
          cargo check
          cargo test
          swift test --package-path apps/mac

  docs:
    name: Docs site checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test benchmark release policy
        run: bun run bench:test

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Check
        working-directory: docs
        run: bun run check
