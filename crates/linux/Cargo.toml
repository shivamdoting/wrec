[package]
name = "linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
domain = { path = "../domain" }
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
gstreamer = { version = "0.23", features = ["v1_22"] }
gstreamer-allocators = { version = "0.23", features = ["v1_22"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
x11rb = "0.13"
x11-dl = "2.21"

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = "1"
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
